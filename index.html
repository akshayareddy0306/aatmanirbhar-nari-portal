<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aatmanirbhar Nari — Home Business Enablement Platform</title>
  <meta name="description" content="A digital platform empowering women-led home businesses and small enterprises with verified discovery, direct customer purchase requests, and business enablement." />
  
  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23FBECEF'/><circle cx='50' cy='50' r='38' fill='%23B96F83'/></svg>" />

  <!-- Google Fonts: Plus Jakarta Sans & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

<body>

  <!-- =========================================================================
       OPENING 2-SECOND ELEGANT BRAND SPLASH SCREEN (REQUIREMENT 3)
       Subtle logo reveal and fade animation with skip option
       ========================================================================= -->
  <div id="brand-splash">
    <div class="splash-content">
      <div class="splash-logo-mark">
        <!-- Injected via JavaScript with default silhouette or admin custom logo -->
      </div>
      <h1 class="splash-title">Aatmanirbhar Nari</h1>
      <p class="splash-subtitle">Home Business Enablement</p>
      <div class="splash-progress-bar">
        <div class="splash-progress-fill"></div>
      </div>
      <div>
        <button class="splash-skip-btn">Skip Intro &rarr;</button>
      </div>
    </div>
  </div>

  <!-- Main Single-Page Application Mounting Root -->
  <div id="root"></div>

  <!-- Dynamic Modal Overlay Root -->
  <div id="modal-root"></div>

  <!-- Toast Notifications Root -->
  <div id="toast-container"></div>

  <!-- Application Scripts -->
  <script src="./js/db.js"></script>
  <script src="./js/app.js"></script>
